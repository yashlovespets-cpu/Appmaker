<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appmaker Image Intake</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e0e2e6;
    --text: #1c1f24;
    --muted: #667085;
    --accent: #3d5afe;
    --accent-text: #ffffff;
    --danger: #d93025;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --panel: #1e2127;
      --border: #30343c;
      --text: #edeef0;
      --muted: #9aa1ac;
      --accent: #5b7cfa;
      --accent-text: #0b0d10;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 24px 20px 8px;
    max-width: 960px;
    margin: 0 auto;
  }
  header h1 { font-size: 20px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  main { max-width: 960px; margin: 0 auto; padding: 16px 20px 60px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  #uploadForm { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  #uploadForm .field-full { grid-column: 1 / -1; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  input[type="text"], input[type="search"], input[type="file"] {
    font: inherit;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
  }
  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 14px;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--danger); border-color: var(--danger); }
  #uploadForm button { grid-column: 1 / -1; justify-self: start; }
  .toolbar { display: flex; gap: 8px; align-items: center; }
  .toolbar input[type="search"] { flex: 1; }
  .status { font-size: 13px; color: var(--muted); margin: 4px 2px 0; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .upload-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .upload-card .thumb {
    background: repeating-conic-gradient(#00000010 0% 25%, transparent 0% 50%) 50% / 16px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 150px;
  }
  .upload-card img { max-width: 100%; max-height: 150px; display: block; }
  .upload-card .meta { padding: 10px 12px; display: grid; gap: 4px; }
  .upload-card .meta .row { font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
  .upload-card .meta .row .k { color: var(--muted); }
  .upload-card .meta .row .v { font-weight: 600; text-align: right; word-break: break-all; }
  .upload-card .actions { display: flex; gap: 6px; padding: 0 12px 12px; }
  .upload-card .actions button { flex: 1; font-size: 12px; padding: 6px 8px; }
  .empty { color: var(--muted); font-size: 14px; padding: 20px 4px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Appmaker Image Intake</h1>
  <p>Submit an image with its Page ID and Block Label. Everything is stored in this page's own browser storage as data URLs, so anything reading this tab's DOM/JS gets the raw image bytes with no cross-origin fetch involved.</p>
</header>
<main>
  <form id="uploadForm" class="panel">
    <label>Page ID
      <input type="text" name="pageId" required placeholder="e.g. home">
    </label>
    <label>Block Label
      <input type="text" name="blockLabel" required placeholder="e.g. hero-banner">
    </label>
    <label class="field-full">Image
      <input type="file" name="image" accept="image/*" required>
    </label>
    <button type="submit" class="primary">Add Upload</button>
  </form>

  <div class="panel toolbar">
    <input type="search" id="searchBox" placeholder="Filter by Page ID or Block Label">
    <button id="exportBtn">Export JSON</button>
    <button id="clearBtn" class="danger">Clear All</button>
  </div>
  <div class="status" id="status"></div>

  <section id="list" class="grid" aria-label="Uploaded images"></section>
</main>

<script>
(function () {
  const DB_NAME = "appmaker-intake";
  const STORE = "uploads";
  let db = null;
  let records = [];

  function openDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const upgradeDb = req.result;
        if (!upgradeDb.objectStoreNames.contains(STORE)) {
          upgradeDb.createObjectStore(STORE, { keyPath: "id" });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function tx(mode) {
    return db.transaction(STORE, mode).objectStore(STORE);
  }

  function putRecord(record) {
    return new Promise((resolve, reject) => {
      const req = tx("readwrite").put(record);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  function deleteRecord(id) {
    return new Promise((resolve, reject) => {
      const req = tx("readwrite").delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  function clearStore() {
    return new Promise((resolve, reject) => {
      const req = tx("readwrite").clear();
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  function getAllRecords() {
    return new Promise((resolve, reject) => {
      const req = tx("readonly").getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
  }

  function fmtBytes(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / (1024 * 1024)).toFixed(2) + " MB";
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function render() {
    const list = document.getElementById("list");
    const query = document.getElementById("searchBox").value.trim().toLowerCase();
    const filtered = records.filter((r) => {
      if (!query) return true;
      return r.pageId.toLowerCase().includes(query) || r.blockLabel.toLowerCase().includes(query);
    });

    document.getElementById("status").textContent =
      records.length === 0
        ? "No uploads yet."
        : `${filtered.length} of ${records.length} upload(s) shown.`;

    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty">Nothing to show.</div>`;
      return;
    }

    list.innerHTML = filtered.map((r) => `
      <article class="upload-card"
                data-appmaker-upload
                data-id="${escapeHtml(r.id)}"
                data-page-id="${escapeHtml(r.pageId)}"
                data-block-label="${escapeHtml(r.blockLabel)}"
                data-file-name="${escapeHtml(r.fileName)}"
                data-mime-type="${escapeHtml(r.mimeType)}"
                data-created-at="${escapeHtml(r.createdAt)}">
        <div class="thumb">
          <img data-role="upload-image" src="${r.imageDataUrl}" alt="${escapeHtml(r.fileName)}">
        </div>
        <div class="meta">
          <div class="row"><span class="k">Page ID</span><span class="v">${escapeHtml(r.pageId)}</span></div>
          <div class="row"><span class="k">Block Label</span><span class="v">${escapeHtml(r.blockLabel)}</span></div>
          <div class="row"><span class="k">File</span><span class="v">${escapeHtml(r.fileName)}</span></div>
          <div class="row"><span class="k">Size</span><span class="v">${fmtBytes(r.byteLength)}</span></div>
        </div>
        <div class="actions">
          <button data-action="copy" data-id="${escapeHtml(r.id)}">Copy Data URL</button>
          <button data-action="delete" data-id="${escapeHtml(r.id)}" class="danger">Delete</button>
        </div>
      </article>
    `).join("");
  }

  async function loadAll() {
    records = await getAllRecords();
    records.sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
    render();
  }

  async function handleSubmit(e) {
    e.preventDefault();
    const form = e.target;
    const pageId = form.pageId.value.trim();
    const blockLabel = form.blockLabel.value.trim();
    const file = form.image.files[0];
    if (!pageId || !blockLabel || !file) return;

    const imageDataUrl = await fileToDataUrl(file);
    const record = {
      id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()),
      pageId,
      blockLabel,
      fileName: file.name,
      mimeType: file.type,
      byteLength: file.size,
      imageDataUrl,
      createdAt: new Date().toISOString(),
    };

    await putRecord(record);
    records.unshift(record);
    render();
    form.reset();
  }

  async function handleListClick(e) {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    const record = records.find((r) => r.id === id);
    if (!record) return;

    if (btn.dataset.action === "delete") {
      await deleteRecord(id);
      records = records.filter((r) => r.id !== id);
      render();
    } else if (btn.dataset.action === "copy") {
      try {
        await navigator.clipboard.writeText(record.imageDataUrl);
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Copy Data URL"; }, 1200);
      } catch (err) {
        console.warn("Clipboard write failed", err);
      }
    }
  }

  async function handleClearAll() {
    if (!confirm("Delete all stored uploads? This cannot be undone.")) return;
    await clearStore();
    records = [];
    render();
  }

  function handleExport() {
    const blob = new Blob([JSON.stringify(records, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "appmaker-uploads.json";
    a.click();
    URL.revokeObjectURL(url);
  }

  // Exposed for same-origin JS/extension access: no fetch, no CORS,
  // just read image bytes straight out of page state.
  window.appmakerUploads = {
    getAll: () => records.slice(),
    getById: (id) => records.find((r) => r.id === id) || null,
    refresh: loadAll,
  };

  document.getElementById("uploadForm").addEventListener("submit", handleSubmit);
  document.getElementById("list").addEventListener("click", handleListClick);
  document.getElementById("searchBox").addEventListener("input", render);
  document.getElementById("exportBtn").addEventListener("click", handleExport);
  document.getElementById("clearBtn").addEventListener("click", handleClearAll);

  openDb().then((openedDb) => {
    db = openedDb;
    loadAll();
  });
})();
</script>
</body>
</html>
